name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local development cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # DATABASE_URL must be SET, not reachable.
        #
        # `lib/infra/db.ts` throws at module scope when it is missing, and every
        # page imports it transitively — so without this the build dies while
        # collecting page data, long before any query runs. (That is what the
        # MongoDB service container here used to paper over; nothing has read
        # Mongo since the Neon migration.)
        #
        # Every build-time database read degrades to empty when the host cannot
        # be reached — see `getActiveExams` callers — so a placeholder is all CI
        # needs. `test/integration/db-env.test.ts` pins the module-scope
        # contract this relies on.
        #
        # The Clerk keys only need to be well-formed: the CSP is derived from
        # the publishable key at build time. Real values live in the host.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci_placeholder
        run: npm run build
